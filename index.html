<h1> calculadora</h1>
<p>minha priemeira calculadora feita para web</p>

<style>
h1 {
    color:rgb(0, 4, 255)
}
body {
    color:rgb(43, 44, 46)
}

</style>

<body>
<input type="number" id="1">
<input type="number" id="2">
<button id="somar">+</button>
<button id="subtrair">-</button>
<button id="multiplicar">x</button>
<button id="dividir">:</button>
<button id="porcentagem">%</button>
<p id="resultado">resultado: </p>
</body>

<script>
let numero1 = document.getElementById("1")
let numero2 = document.getElementById("2")
let botaoSomar = document.getElementById("somar")
botaoSomar.addEventListener("click", function() {
        let soma = Number(numero1.value) + Number(numero2.value)
        document.getElementById("resultado").textContent = soma
        })
let botaosubtrair = document.getElementById("subtrair")
botaosubtrair.addEventListener("click", function() {
        let subtrair = Number(numero1.value) - Number(numero2.value)
        document.getElementById("resultado").textContent = subtrair
        })
let botaomultiplicar = document.getElementById("multiplicar")
botaomultiplicar.addEventListener("click", function() {
        let multiplicar = Number(numero1.value) * Number(numero2.value)
        document.getElementById("resultado").textContent = multiplicar
        })
let botaodividir = document.getElementById("dividir")
botaodividir.addEventListener("click", function() {
        let dividir = Number(numero1.value) / Number(numero2.value)
        document.getElementById("resultado").textContent = dividir
        })
let botaoporcentagem = document.getElementById("porcentagem")
botaoporcentagem.addEventListener("click", function() {
        let porcentagem = Number(numero1.value) / 100 * Number(numero2.value)
        document.getElementById("resultado").textContent = porcentagem
        })
</script>
